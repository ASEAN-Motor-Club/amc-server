name: Deploy Peripheral

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-peripheral
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deploy-peripheral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Deploy
        run: |
          # Trigger the root-owned self-deploy service (runs without
          # systemd namespace restrictions) and wait for it to complete.
          systemctl start amc-peripheral-deploy

      - name: Health check
        run: |
          echo "Checking services..."
          # Core services must be active immediately after a deploy.
          for svc in amc-radio nginx postgresql; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              echo "  $svc: active"
            else
              echo "  $svc: not running"
              exit 1
            fi
          done
          # podman-hermes-agent may be "activating" during a first-boot image
          # build, so only fail on a hard "failed" state (e.g. crash loop).
          hs=$(systemctl is-active podman-hermes-agent 2>/dev/null || true)
          if [ "$hs" = "failed" ]; then
            echo "  podman-hermes-agent: failed"
            exit 1
          fi
          echo "  podman-hermes-agent: $hs"
          echo "All services healthy"
