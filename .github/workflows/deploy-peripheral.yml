name: Deploy Peripheral

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-peripheral
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deploy-peripheral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Deploy
        run: |
          ACCESS_TOKEN=$(/run/current-system/sw/bin/gh-token)
          sudo env HOME=/root nixos-rebuild switch \
            --flake .#amc-peripheral \
            --fast \
            --option access-tokens "github.com=$ACCESS_TOKEN"

      - name: Health check
        run: |
          echo "Checking services..."
          for svc in amc-radio amc-bot nginx; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              echo "  $svc: active"
            else
              echo "  $svc: not running"
              exit 1
            fi
          done
          echo "All services healthy"
