name: Deploy Peripheral

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-peripheral
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deploy-peripheral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Configure Git Auth & Prepare Submodules
        env:
          # Write .gitconfig to the workspace (writable) instead of $HOME
          # which may be read-only under systemd ProtectSystem=strict.
          HOME: ${{ github.workspace }}
        run: |
          TOKEN=$(/run/current-system/sw/bin/gh-token)
          # Rewrite both HTTPS and SSH GitHub URLs to include the token.
          # Handles relative URLs in .gitmodules (resolved to github.com) and
          # the two absolute SSH URLs (beammp-server-flake, assetto-server-flake).
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Deploy
        run: |
          ACCESS_TOKEN=$(/run/current-system/sw/bin/gh-token)
          sudo env HOME=/root nixos-rebuild switch \
            --flake .#amc-peripheral \
            --fast \
            --option access-tokens "github.com=$ACCESS_TOKEN"

      - name: Health check
        run: |
          echo "Checking services..."
          for svc in amc-radio amc-bot nginx; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              echo "  $svc: active"
            else
              echo "  $svc: not running"
              exit 1
            fi
          done
          echo "All services healthy"
