name: Update submodule pins

# Manual trigger for the root-side github-pin-bump.service on
# amc-peripheral (the weekly schedule lives in the systemd timer:
# Sun 21:00 UTC / Mon 04:00 +07). The GitHub runner is intentionally
# sandboxed (no capabilities, PrivateUsers) and cannot hold the GitHub
# App key — so it only starts the unit and prints the result, exactly
# like deploy-peripheral does for amc-peripheral-deploy.

on:
  workflow_dispatch:

jobs:
  bump:
    runs-on: [self-hosted, deploy-peripheral]
    timeout-minutes: 15
    steps:
      - name: Trigger pin bump service
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          systemctl start --no-pager github-pin-bump.service

      - name: Result
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          cat /var/lib/github-pin-bump/result.json
